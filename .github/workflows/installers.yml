name: Build and publish native installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: '1.2.9'
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install "packaging>=24"
      - name: Check build environment
        run: python -c "import sys, tomllib; from packaging.requirements import Requirement; assert sys.version_info[:2] == (3, 11); print(sys.executable); print(sys.version)"
      - uses: astral-sh/setup-uv@v6
      - name: Select version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check update download format and persistent cache
        run: python -m unittest discover -s tests -p test_appimage_update.py
      - name: Check packaging exclusion and integrity rules
        run: python -m unittest discover -s tests -p test_payload_integrity.py
      - name: Check optional engine packaging and startup behavior
        run: python -m unittest discover -s tests -p test_optional_engines.py
      - name: Fetch current platform dependencies only
        run: python packaging/download_platform.py
      - name: Build and check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/stage.py "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows_release.py "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise all four Windows installer checkbox combinations
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 55
        run: |
          python -m pip install pywinauto psutil pywin32
          python packaging/test_windows_wizard.py "$VERSION"
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev squashfs-tools desktop-file-utils xdotool x11-utils libegl1 libgl1 libopengl0 libglib2.0-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 \
            libxext6 libxrender1 libxi6 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libsm6 libice6 libxinerama1 libcups2 libcairo2 libnss3 libnspr4 \
            libdbus-glib-1-2 libgomp1 libasound2 xvfb xauth fonts-dejavu-core
          python -c "import ctypes; [ctypes.CDLL(name) for name in ('libEGL.so.1', 'libGL.so.1', 'libOpenGL.so.0', 'libxkbcommon-x11.so.0', 'libxcb-cursor.so.0')]; print('Linux GUI runtime libraries loaded')"
      - name: Stage and check macOS bundle
        if: runner.os == 'macOS'
        run: |
          app="build/macos-$(python3 -c 'import platform; print("arm64" if platform.machine() == "arm64" else "x64")')-app"
          python3 packaging/stage.py "$VERSION"
          QT_QPA_PLATFORM=offscreen "$app/python/bin/python3.11" packaging/smoke.py "$app"
          bash packaging/unix.sh "$VERSION"
      - id: linux_bundle
        name: Stage and check Linux bundle
        if: runner.os == 'Linux'
        run: |
          app="build/linux-$(python3 -c 'import platform; print("arm64" if platform.machine() in {"arm64", "aarch64"} else "x64")')-app"
          python3 packaging/stage.py "$VERSION"
          QT_QPA_PLATFORM=offscreen "$app/python/bin/python3.11" packaging/smoke.py "$app"
          xvfb-run -a env QT_QPA_PLATFORM=xcb "$app/python/bin/python3.11" -c "from PySide6.QtWidgets import QApplication,QWidget; a=QApplication([]); w=QWidget(); w.show(); a.processEvents(); w.close()"
          bash packaging/unix.sh "$VERSION"
      - name: Install, upgrade and reopen Linux deb
        if: always() && steps.linux_bundle.outcome == 'success' && !cancelled()
        timeout-minutes: 35
        shell: bash
        run: |
          logs="build/linux-update-test-logs/deb/logs"
          mkdir -p "$logs"
          sudo -E xvfb-run -a "$(command -v python)" packaging/test_linux_updates.py "$VERSION" deb 2>&1 | tee "$logs/integration.log"
      - name: Install, upgrade and reopen Linux appimage
        if: always() && steps.linux_bundle.outcome == 'success' && !cancelled()
        timeout-minutes: 35
        shell: bash
        run: |
          logs="build/linux-update-test-logs/appimage/logs"
          mkdir -p "$logs"
          sudo -E xvfb-run -a "$(command -v python)" packaging/test_linux_updates.py "$VERSION" appimage 2>&1 | tee "$logs/integration.log"
      - name: Install, upgrade and reopen Linux tar.gz
        if: always() && steps.linux_bundle.outcome == 'success' && !cancelled()
        timeout-minutes: 35
        shell: bash
        run: |
          logs="build/linux-update-test-logs/tar.gz/logs"
          mkdir -p "$logs"
          sudo -E xvfb-run -a "$(command -v python)" packaging/test_linux_updates.py "$VERSION" tar.gz 2>&1 | tee "$logs/integration.log"
      - name: Install, update and reopen Windows and macOS applications
        if: runner.os != 'Linux'
        timeout-minutes: 25
        shell: bash
        run: python packaging/test_native_updates.py "$VERSION"
      - name: Upload native upgrade test logs
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Native-upgrade-test-logs-${{ runner.os }}
          path: build/native-update-test-logs/
          if-no-files-found: ignore
      - name: Upload Linux upgrade test logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-upgrade-test-logs
          path: build/linux-update-test-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Formix-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
  ubuntu-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, tar.gz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Formix-ubuntu-22.04
          path: dist
      - name: Launch released package as desktop user
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          folder="build/linux-update-test-logs/$FORMAT"
          mkdir -p "$folder/logs" "$folder/reports"
          exec > >(tee "$folder/logs/compatibility.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libfuse2t64
          case "$FORMAT" in
            deb) sudo apt-get install -y "$PWD"/dist/*.deb; app=/usr/bin/formix ;;
            appimage)
              app=$(realpath dist/*.AppImage)
              chmod +x "$app"
              if [[ ! -r /dev/fuse || ! -w /dev/fuse ]]; then export APPIMAGE_EXTRACT_AND_RUN=1; fi ;;
            tar.gz)
              mkdir -p "$RUNNER_TEMP/Portable Formix"
              tar -xf dist/*.tar.gz -C "$RUNNER_TEMP/Portable Formix"
              app=$(realpath "$RUNNER_TEMP/Portable Formix"/*/Formix) ;;
          esac
          export FORMIX_CI_CONTROL="$PWD/$folder/reports/control.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["FORMIX_CI_CONTROL"]); p.write_text(json.dumps(dict(phase="verify",report=str(p.parent/"launch.json"),screenshots=str(p.parents[1]/"screenshots"),close=True)))'
          cd "$RUNNER_TEMP"
          timeout 180 xvfb-run -a env QT_QPA_PLATFORM=xcb "$app"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["FORMIX_CI_CONTROL"]); r=json.loads((p.parent/"launch.json").read_text()); assert r["visible"] and r["exposed"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ubuntu-24.04-${{ matrix.format }}-launch
          path: build/linux-update-test-logs/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ubuntu-compatibility]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Formix-*
          path: dist
          merge-multiple: true
      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
