name: Build and publish native installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: '1.2.9'
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Select version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Fetch current platform dependencies only
        run: python packaging/download_platform.py
      - name: Stage and check Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = python -c "import platform; print('arm64' if platform.machine().lower() in ('arm64', 'aarch64') else 'x64')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -notin @(0,3010)) { exit $LASTEXITCODE }
          python packaging/stage.py $env:VERSION
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = "build/windows-$arch-app"
          & "$app/python/python.exe" packaging/smoke.py $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DVersion=$env:VERSION" "/DBuildArch=$arch" packaging/windows.iss
      - name: Stage and check macOS bundle
        if: runner.os == 'macOS'
        run: |
          app="build/macos-$(python3 -c 'import platform; print("arm64" if platform.machine() == "arm64" else "x64")')-app"
          python3 packaging/stage.py "$VERSION"
          QT_QPA_PLATFORM=offscreen "$app/python/bin/python3.11" packaging/smoke.py "$app"
          bash packaging/unix.sh "$VERSION"
      - name: Stage and check Linux bundle
        if: runner.os == 'Linux'
        run: |
          app="build/linux-$(python3 -c 'import platform; print("arm64" if platform.machine() in {"arm64", "aarch64"} else "x64")')-app"
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python3 packaging/stage.py "$VERSION"
          QT_QPA_PLATFORM=offscreen "$app/python/bin/python3.11" packaging/smoke.py "$app"
          bash packaging/unix.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Formix-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Formix-*
          path: dist
          merge-multiple: true
      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
